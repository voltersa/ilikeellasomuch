<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Reasons I Like Ella</title>
<style>
  :root{
    /* dark/pink theme */
    --bg:#1b1517;           /* page background */
    --panel:#0f0d0e;        /* card background */
    --pink-100:#ffd9e8;
    --pink-300:#ffb0d0;
    --pink-500:#e8558d;
    --pink-700:#c23b72;
    --gold:#f6c453;
    --text:#f3dbe6;         /* main text */
    --muted:#caa6b5;
    --card:#110f10;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x:hidden;
  }

  /* strong pink side glows */
  .glow{
    position:fixed; top:0; bottom:0; width:22vw; pointer-events:none; z-index:0; filter:blur(80px); mix-blend-mode:screen;
  }
  .glow-left{ left:0; background: radial-gradient(circle at 20% 50%, rgba(232,85,141,0.45), rgba(232,85,141,0.18) 25%, transparent 55%); }
  .glow-right{ right:0; background: radial-gradient(circle at 80% 50%, rgba(232,85,141,0.45), rgba(232,85,141,0.18) 25%, transparent 55%); }

  /* floating hearts background (subtle on dark) */
  .floaters{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .floaters span{
    position:absolute; bottom:-10%;
    font-size:20px; color:var(--pink-300); opacity:.18;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.18; }
    100%{ transform:translateY(-120vh) rotate(25deg); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .floaters{ display:none; }
    *{ animation-duration:0.01ms !important; }
  }

  /* HERO */
  .hero{
    position:relative; z-index:1;
    padding:6.5rem 1.5rem 4rem;
    text-align:center;
  }
  .hero .eyebrow{
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.6rem;
    color:var(--pink-300);
    display:block;
    margin-bottom:.25rem;
    transform:rotate(-2deg);
    opacity:.95;
  }
  .hero h1{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:900;
    font-size:clamp(2.6rem, 7vw, 5rem);
    margin:0;
    line-height:1.05;
    color:var(--pink-100);
    /* bold pink 3D effect */
    text-shadow: 6px 6px 0 var(--pink-700), 3px 3px 0 rgba(0,0,0,0.45);
    letter-spacing:0.5px;
  }
  .hero h1 .num{
    color:var(--pink-100);
    -webkit-text-stroke: 1px rgba(0,0,0,0.45);
  }
  .hero p.sub{
    max-width:680px;
    margin:1.1rem auto 0;
    font-size:1.05rem;
    color:var(--muted);
  }
  .heart-divider{
    margin:2rem auto 0;
    font-size:1.4rem;
    color:var(--pink-300);
    letter-spacing:.6rem;
  }

  /* COUNTER / SHUFFLE BAR */
  .toolbar{
    position:relative; z-index:1;
    max-width:740px;
    margin:0 auto 2.5rem;
    padding:0 1.5rem;
    display:flex;
    gap:.75rem;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .pill{
    background:transparent;
    border:1px solid rgba(255,182,211,0.08);
    border-radius:999px;
    padding:.6rem 1.1rem;
    font-weight:700;
    font-size:.95rem;
    color:var(--pink-300);
    box-shadow: 0 6px 18px rgba(200,60,110,0.06) inset, 0 12px 30px rgba(0,0,0,0.6);
  }
  #shuffleBtn{
    cursor:pointer;
    background:linear-gradient(180deg,var(--pink-300),var(--pink-500));
    color:white;
    border:none;
    border-radius:999px;
    padding:.65rem 1.3rem;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:800;
    font-size:.95rem;
    box-shadow:0 6px 18px rgba(194,59,94,0.28);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #shuffleBtn:hover{ transform: translateY(-3px); box-shadow:0 12px 32px rgba(194,59,94,0.38); }
  #shuffleBtn:active{ transform: translateY(1px); box-shadow:0 6px 12px rgba(194,59,94,0.22); }
  #shuffleBtn:focus-visible, .pill:focus-visible{ outline:3px solid rgba(246,196,83,0.14); outline-offset:2px; }

  /* SPOTLIGHT (shuffle result) */
  #spotlight{
    max-width:560px;
    margin:0 auto 3rem;
    padding:0 1.5rem;
    text-align:center;
    min-height:1.5rem;
  }
  #spotlight .box{
    display:inline-block;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border:1px dashed rgba(232,85,141,0.12);
    border-radius:20px;
    padding:1.1rem 1.6rem;
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.25rem;
    color:var(--pink-300);
    transform:rotate(-1deg);
    box-shadow:0 10px 40px rgba(232,85,141,0.06);
  }

  /* GRID */
  .grid{
    position:relative; z-index:1;
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 5rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:1.3rem;
  }
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.03));
    border-radius:14px;
    padding:1.2rem 1.2rem 1.4rem;
    box-shadow:0 8px 24px rgba(0,0,0,0.7), 0 2px 0 rgba(0,0,0,0.6) inset;
    border:1px solid rgba(232,85,141,0.06);
    position:relative;
    transition: transform .18s cubic-bezier(.2,.9,.2,1), box-shadow .18s ease;
    color:var(--text);
  }
  .card:nth-child(3n+1){ transform:rotate(-1.1deg); }
  .card:nth-child(3n+2){ transform:rotate(0.8deg); }
  .card:nth-child(3n){ transform:rotate(-0.4deg); }
  .card:hover{
    transform: translateY(-6px) rotate(0deg) scale(1.02);
    box-shadow:0 20px 50px rgba(194,59,94,0.26);
    z-index:2;
  }
  .card .badge{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:700;
    font-size:.8rem;
    color:white;
    background:linear-gradient(180deg,var(--pink-500),var(--pink-700));
    display:inline-block;
    padding:.25rem .6rem;
    border-radius:999px;
    margin-bottom:.6rem;
    box-shadow:0 6px 18px rgba(194,59,94,0.12);
  }
  .card p{
    margin:0;
    font-size:1rem;
    line-height:1.5;
    color:var(--text);
  }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding:3rem 1.5rem 4.5rem;
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.2rem;
    color:var(--pink-300);
  }

  /* responsive tweaks */
  @media (max-width:520px){
    .grid{ grid-template-columns:1fr; padding:0 1rem 4rem; }
    .hero h1{ font-size:2.4rem; }
  }
</style>
</head>
