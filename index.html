<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Reasons I Love Ella</title>
<style>
  :root{
    --bg-dark: #000007;
    --bg-deep: #05010a;
    --pink-soft:#FFD9E8;
    --blush:#FFB8D9;
    --rose:#E8558D;
    --berry:#C23B72;
    --gold:#F6C453;
    --fg:#FFEAF6; /* light foreground */
    --card: rgba(255,255,255,0.05);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background: linear-gradient(180deg,var(--bg-dark), var(--bg-deep));
    color:var(--fg);
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* canvas stars (decorative) */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none; display:block;
  }

  /* strong pink side glow (visible on dark bg) */
  .side-glow{
    position:fixed;
    top:0;
    right:-8vw;
    width:48vw;
    height:100vh;
    pointer-events:none;
    z-index:0;
    background: radial-gradient(closest-side at 20% 50%, rgba(232,85,141,0.30), rgba(232,85,141,0.18) 28%, rgba(255,217,232,0.06) 55%, transparent 75%);
    filter: blur(80px);
    mix-blend-mode:screen;
  }

  /* HERO */
  .hero{
    position:relative; z-index:2;
    padding:6.5rem 1.5rem 4rem;
    text-align:center;
  }
  .hero .eyebrow{
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.6rem;
    color:var(--pink-soft);
    display:block;
    margin-bottom:.25rem;
    transform:rotate(-2deg);
  }
  .hero h1{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:800;
    font-size:clamp(2.6rem, 7vw, 5rem);
    margin:0;
    line-height:1.05;
    color:var(--fg);
    text-shadow: 0 8px 24px rgba(232,85,141,0.18);
  }
  .hero h1 .num{
    color:var(--pink-soft);
    -webkit-text-stroke: 1px rgba(200,50,100,0.25);
  }
  .hero p.sub{
    max-width:640px;
    margin:1.1rem auto 0;
    font-size:1.05rem;
    color:rgba(255,234,246,0.9);
  }
  .heart-divider{
    margin:2rem auto 0;
    font-size:1.4rem;
    color:var(--pink-soft);
    letter-spacing:.6rem;
  }

  /* COUNTER / SHUFFLE BAR */
  .toolbar{
    position:relative; z-index:2;
    max-width:640px;
    margin:0 auto 2.5rem;
    padding:0 1.5rem;
    display:flex;
    gap:.75rem;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
  }
  .pill{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,200,220,0.06);
    border-radius:999px;
    padding:.6rem 1.1rem;
    font-weight:600;
    font-size:.95rem;
    color:var(--pink-soft);
    box-shadow: 0 3px 0 rgba(232,85,141,0.06);
  }
  #shuffleBtn{
    cursor:pointer;
    background:linear-gradient(180deg,var(--rose), #d64a78);
    color:white;
    border:none;
    border-radius:999px;
    padding:.65rem 1.3rem;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:700;
    font-size:.95rem;
    box-shadow:0 6px 26px rgba(232,85,141,0.18);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #shuffleBtn:hover{ transform: translateY(-2px); box-shadow:0 10px 36px rgba(232,85,141,0.22); }
  #shuffleBtn:active{ transform: translateY(1px); box-shadow:0 4px 12px rgba(232,85,141,0.14); }
  #shuffleBtn:focus-visible, .pill:focus-visible{ outline:3px solid rgba(246,196,83,0.14); outline-offset:2px; }

  /* SPOTLIGHT (shuffle result) */
  #spotlight{
    max-width:560px;
    margin:0 auto 3rem;
    padding:0 1.5rem;
    text-align:center;
    min-height:1.5rem;
    z-index:2;
  }
  #spotlight .box{
    display:inline-block;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px dashed rgba(232,85,141,0.14);
    border-radius:20px;
    padding:1.1rem 1.6rem;
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.35rem;
    color:var(--pink-soft);
    transform:rotate(-1deg);
    box-shadow:0 6px 0 rgba(232,85,141,0.06);
  }

  /* GRID */
  .grid{
    position:relative; z-index:2;
    max-width:1100px;
    margin:0 auto;
    padding:0 1.5rem 5rem;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:1.1rem;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:1.1rem 1.1rem 1.2rem;
    box-shadow:0 4px 22px rgba(232,85,141,0.06);
    border:1px solid rgba(255,200,220,0.04);
    position:relative;
    transition: transform .15s ease, box-shadow .15s ease;
    color:rgba(255,238,246,0.95);
  }
  .card:nth-child(3n+1){ transform:rotate(-1.1deg); }
  .card:nth-child(3n+2){ transform:rotate(0.8deg); }
  .card:nth-child(3n){ transform:rotate(-0.4deg); }
  .card:hover{
    transform: translateY(-6px) rotate(0deg) scale(1.02);
    box-shadow:0 12px 40px rgba(232,85,141,0.14);
    z-index:3;
  }
  .card .badge{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-weight:700;
    font-size:.8rem;
    color:white;
    background:var(--rose);
    display:inline-block;
    padding:.15rem .55rem;
    border-radius:999px;
    margin-bottom:.55rem;
  }
  .card p{
    margin:0;
    font-size:1rem;
    line-height:1.4;
    color:rgba(255,235,244,0.95);
  }

  footer{
    position:relative; z-index:2;
    text-align:center;
    padding:2.5rem 1.5rem 3.5rem;
    font-family:'Segoe Print', 'Bradley Hand', cursive;
    font-size:1.2rem;
    color:var(--pink-soft);
  }

  /* mobile: hide heavy blur and limit side glow */
  @media (max-width:640px){
    .side-glow{ display:none; }
  }
</style>
</head>
<body>

<!-- canvas for stars and soft pink side glow -->
<canvas id="stars" aria-hidden="true"></canvas>
<div class="side-glow" aria-hidden="true"></div>

<section class="hero">
  <span class="eyebrow">a little internet corner just for her</span>
  <h1>100 Reasons I <span class="num">Love Ella</span></h1>
  <p class="sub">I started counting once, and then I couldn't stop. So here are all 100, give or take a few I'm probably forgetting.</p>
  <div class="heart-divider">&#9733; &#183; &#9733; &#183; &#9733;</div>
</section>

<div class="toolbar">
  <span class="pill" id="countPill">100 reasons, no exaggeration</span>
  <button id="shuffleBtn" aria-label="Show me a random reason">Surprise me &#127881;</button>
</div>

<div id="spotlight" aria-live="polite"></div>

<div class="grid" id="grid"></div>


<footer>made with a genuinely ridiculous amount of Tae</footer>

<script>
// ---- stars canvas: lightweight twinkling starfield ----
(function(){
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = innerWidth;
  let h = canvas.height = innerHeight;
  const num = Math.floor((w*h)/6000); // density
  const stars = [];
  for(let i=0;i<num;i++){
    stars.push({
      x: Math.random()*w,
      y: Math.random()*h,
      r: Math.random()*1.6 + 0.2,
      a: Math.random()*0.8 + 0.2,
      drift: (Math.random()*0.6-0.3)/200,
      twinkle: Math.random()*0.02 + 0.003,
      phase: Math.random()*Math.PI*2
    });
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    // faint nebulaes: subtle radial gradients
    const g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0, 'rgba(8,4,10,0.08)');
    g.addColorStop(1, 'rgba(8,4,10,0.02)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    for(const s of stars){
      s.phase += s.twinkle;
      const alpha = s.a * (0.6 + 0.4*Math.sin(s.phase));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,241,250,'+alpha+')';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
  addEventListener('resize', ()=>{
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
    // repopulate a bit for new size
    const desired = Math.floor((w*h)/6000);
    while(stars.length < desired){
      stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.6 + 0.2, a: Math.random()*0.8 + 0.2, drift: (Math.random()*0.6-0.3)/200, twinkle: Math.random()*0.02 + 0.003, phase: Math.random()*Math.PI*2 });
    }
    while(stars.length > desired) stars.pop();
  });
})();

  // ---- reasons (unchanged strings) ----
  const reasons = [

  // Ensure we only use the first 100 reasons, even if the array grows
  const MAX_REASONS = 100;
  const totalReasons = Math.min(reasons.length, MAX_REASONS);

  // populate grid safely (avoid innerHTML)
  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < totalReasons; i++){
    const text = reasons[i];

    const card = document.createElement('div');
    card.className = 'card';

    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = '#' + (i+1);

    const p = document.createElement('p');
    p.textContent = text;

    card.appendChild(badge);
    card.appendChild(p);
    frag.appendChild(card);
  }
  grid.appendChild(frag);

  document.getElementById('countPill').textContent = totalReasons + ' reasons, no exaggeration';

  const spotlight = document.getElementById('spotlight');

  // shuffle button: create a safe .box element and guard target usage
  document.getElementById('shuffleBtn').addEventListener('click', ()=>{
    const i = Math.floor(Math.random()*totalReasons);

    const box = document.createElement('div');
    box.className = 'box';
    box.textContent = '#' + (i+1) + ' — ' + reasons[i];

    // replace spotlight content in a safe way
    spotlight.innerHTML = '';
    spotlight.appendChild(box);

    const target = grid.children[i];
    if (target){
      target.scrollIntoView({behavior:'smooth', block:'center'});
      const oldShadow = target.style.boxShadow;
      target.style.boxShadow = '0 0 0 3px rgba(246,196,83,0.06), 0 10px 40px rgba(232,85,141,0.3)';
      setTimeout(()=>{ target.style.boxShadow = oldShadow || ''; }, 1600);
    }
  });
</script>

</body>
</html>
